<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MuzzSnap | Secure Login</title>
  <script>
    if (window.top !== window.self) {
      window.top.location.replace(window.self.location.href);
    }
    window.__MUZZ_APPCHECK_KEY__ = window.__MUZZ_APPCHECK_KEY__ || 'RECAPTCHA_SITE_KEY';
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Fira+Code&display=swap');
    html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .shell{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:380px;text-align:center}
    .logo{width:136px;height:136px;border-radius:28px;box-shadow:0 0 40px rgba(255,0,0,.22);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:.25s}
    .logo:active{transform:scale(.97)}
    .input{width:100%;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,0,0,.2);color:#39ff14;font-family:'Fira Code',monospace;text-align:center;outline:none}
    .spinner{width:40px;height:40px;border:3px solid transparent;border-top-color:#ff0000;border-radius:999px;animation:spin 1s linear infinite}
    .btn-link{width:100%;padding:10px 16px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9ca3af;background:transparent;border:none;font-weight:700;cursor:pointer}
    .btn-link:hover{color:#ef4444}
    .alert{display:none;padding:12px;border-radius:12px;background:rgba(127,29,29,.2);border:1px solid rgba(239,68,68,.4);margin-bottom:20px;text-align:left}
    .hint{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#6b7280}
    .loading-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;border-radius:28px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div style="position:relative;display:inline-block;margin-bottom:20px;">
        <div id="loadingUI" class="loading-overlay"><div class="spinner"></div></div>
        <img id="btnConnect" class="logo" src="https://img1.wsimg.com/isteam/ip/ac9578cb-a6ce-417e-8ad5-b2d6701462eb/1000030902.png/:/rs=w:1440,h:1440" alt="MuzzSnap">
      </div>

      <h1 style="font-family:'Orbitron',sans-serif;font-size:30px;font-weight:900;font-style:italic;margin:0 0 6px;">MUZZ<span style="color:#dc2626;">SNAP</span></h1>
      <p class="hint" style="margin:0 0 28px;">SIWE + Firebase + App Check</p>

      <div id="errorBox" class="alert">
        <div id="errorTitle" style="color:#ef4444;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:4px;"></div>
        <div id="errorDesc" style="color:#d1d5db;font-size:12px;line-height:1.45;"></div>
      </div>

      <div style="display:grid;gap:14px;margin-bottom:20px;">
        <input id="nicknameInput" class="input" maxlength="24" placeholder="ENTER_NICKNAME...">
        <button id="guestBtn" class="btn-link">[ Initialize Guest Protocol ]</button>
      </div>

      <p class="hint">Tap logo for wallet sign-in</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getAuth, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app-check.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js';

    const firebaseConfig = {
      apiKey: atob('QUl6YVN5QWUxLUpmTmRlME5LSU1kRTdwaGZFWGxtOUphcVVIMGpZ'),
      authDomain: atob('cHVsc2FyaS5maXJlYmFzZWFwcC5jb20='),
      databaseURL: atob('aHR0cHM6Ly9wdWxzYXJpLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=='),
      projectId: atob('cHVsc2FyaQ=='),
      storageBucket: atob('cHVsc2FyaS5maXJlYmFzZXN0b3JhZ2UuYXBw'),
      messagingSenderId: atob('ODI0MzA2MzIxMjMz'),
      appId: atob('MTo4MjQzMDYzMjEyMzM6d2ViOjJjOWJmYTAyMTcwYTE3ZDU2MGI1NzA=')
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const functions = getFunctions(app, 'us-central1');
    initializeAppCheck(app, {
      provider: new ReCaptchaV3Provider(window.__MUZZ_APPCHECK_KEY__),
      isTokenAutoRefreshEnabled: true
    });

    const requestLoginNonce = httpsCallable(functions, 'requestLoginNonce', { limitedUseAppCheckTokens: true });
    const verifyWalletLogin = httpsCallable(functions, 'verifyWalletLogin', { limitedUseAppCheckTokens: true });
    const createGuestSession = httpsCallable(functions, 'createGuestSession', { limitedUseAppCheckTokens: true });

    const loadingUI = document.getElementById('loadingUI');
    const errorBox = document.getElementById('errorBox');
    const errorTitle = document.getElementById('errorTitle');
    const errorDesc = document.getElementById('errorDesc');
    const nicknameInput = document.getElementById('nicknameInput');
    const btnConnect = document.getElementById('btnConnect');
    const guestBtn = document.getElementById('guestBtn');

    function setLoading(flag) {
      loadingUI.style.display = flag ? 'flex' : 'none';
    }

    function showError(title, desc) {
      errorBox.style.display = 'block';
      errorTitle.textContent = title;
      errorDesc.textContent = desc;
      setLoading(false);
    }

    function hideError() {
      errorBox.style.display = 'none';
      errorTitle.textContent = '';
      errorDesc.textContent = '';
    }

    function makeSiweMessage({ domain, address, uri, version, chainId, nonce, issuedAt, statement }) {
      return `${domain} wants you to sign in with your Ethereum account:\n${address}\n\n${statement}\n\nURI: ${uri}\nVersion: ${version}\nChain ID: ${chainId}\nNonce: ${nonce}\nIssued At: ${issuedAt}`;
    }

    async function finishLogin(token, session) {
      await signInWithCustomToken(auth, token);
      if (session?.wallet) sessionStorage.setItem('muzz_wallet_address', session.wallet);
      if (session?.username) sessionStorage.setItem('muzz_username', session.username);
      if (session?.role) sessionStorage.setItem('muzz_role', session.role);
      window.location.href = 'chat.html';
    }

    async function accessWithWallet() {
      hideError();
      if (!window.ethereum) {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          const dappUrl = window.location.href.split('//')[1];
          window.location.href = `https://metamask.app.link/dapp/${dappUrl}`;
          return;
        }
        showError('NO_WALLET', 'Instala MetaMask o usa un navegador Web3.');
        return;
      }

      try {
        setLoading(true);
        const provider = new ethers.providers.Web3Provider(window.ethereum, 'any');
        await provider.send('eth_requestAccounts', []);
        const signer = provider.getSigner();
        const address = await signer.getAddress();
        const nickname = nicknameInput.value.trim();

        const nonceResult = await requestLoginNonce({});
        const nonceData = nonceResult.data;
        const message = makeSiweMessage({
          domain: nonceData.domain,
          address,
          uri: nonceData.uri,
          version: '1',
          chainId: String(nonceData.chainId),
          nonce: nonceData.nonce,
          issuedAt: new Date().toISOString(),
          statement: 'Sign in to MuzzSnap secure protocol.'
        });

        const signature = await signer.signMessage(message);
        const verifyResult = await verifyWalletLogin({ message, signature, nickname });
        await finishLogin(verifyResult.data.token, verifyResult.data);
      } catch (error) {
        console.error(error);
        showError('AUTH_FAILED', error?.message || 'No se pudo verificar la wallet.');
      }
    }

    async function accessWithGuest() {
      hideError();
      const nickname = nicknameInput.value.trim();
      if (!nickname) {
        showError('REQUIRED', 'Ingresa un nickname.');
        return;
      }
      try {
        setLoading(true);
        const result = await createGuestSession({ nickname });
        await finishLogin(result.data.token, result.data);
      } catch (error) {
        console.error(error);
        showError('GUEST_FAILED', error?.message || 'No se pudo iniciar sesión como invitado.');
      }
    }

    btnConnect.addEventListener('click', accessWithWallet);
    guestBtn.addEventListener('click', accessWithGuest);

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'chat.html';
    });
  </script>
</body>
</html>
