<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MuzzSnap - Terminal Edition</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;700&family=Orbitron:wght@400;900&display=swap');
    :root{--muzz-red:#ff0000;--ryachu-gold:#ffcc00;--itsuki-blue:#00d4ff}
    html,body{height:100%;overflow:hidden;margin:0;padding:0}
    body.dark-theme{background:#050505;color:white}
    body.light-theme{background:#f0f2f5;color:#1a1a1a}
    .panel-3d{border-radius:24px;transition:all 0.3s ease;display:flex;flex-direction:column;height:100%}
    .dark-theme .panel-3d{background:#0c0c0c;border:1px solid rgba(255,0,0,0.15);box-shadow:0 10px 30px rgba(0,0,0,0.8)}
    .light-theme .panel-3d{background:#ffffff;border:1px solid #e0e0e0;box-shadow:0 10px 30px rgba(0,0,0,0.05)}
    .bubble-3d{padding:12px 16px;border-radius:20px;font-size:14px;max-width:85%;line-height:1.4;position:relative}
    .bubble-3d.me{background:linear-gradient(145deg,#ff0000,#b30000);color:white;align-self:flex-end;border-bottom-right-radius:4px}
    .dark-theme .bubble-3d.other{background:#1a1a1a;border:1px solid rgba(255,255,255,0.05)}
    .light-theme .bubble-3d.other{background:#ffffff;border:1px solid #e0e0e0;color:black}
    .bubble-3d.muted{opacity:0.5}
    .ryachu-name{color:var(--ryachu-gold);font-weight:800}
    .itsuki-name{color:var(--itsuki-blue);font-weight:800}
    .esteban-name{color:#ff6b6b;font-weight:800}
    .hacker-input{font-family:'Fira Code',monospace}
    .dark-theme .hacker-input{color:#39ff14!important}
    .emoji-window{max-height:180px;overflow-y:auto;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:15px}
    .emoji-btn{font-size:1.5rem;cursor:pointer;transition:transform 0.2s;display:flex;justify-content:center}
    .custom-scroll::-webkit-scrollbar{width:4px}
    .custom-scroll::-webkit-scrollbar-thumb{background:var(--muzz-red);border-radius:10px}
    .online-indicator{width:8px;height:8px;background:#39ff14;border-radius:50%;box-shadow:0 0 8px #39ff14}
    .admin-btn{font-size:10px;padding:8px 12px;border-radius:8px;background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);color:#ff0000;font-weight:bold;transition:all 0.3s;cursor:pointer}
    .admin-btn:hover{background:#ff0000;color:white}
    .touch-manipulation{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    input,button,select,textarea{font-size:16px}
    .custom-scroll{-webkit-overflow-scrolling:touch}
    @supports (-webkit-touch-callout:none){.h-screen{height:-webkit-fill-available}}
    .pinned-message{animation:slideDown 0.3s ease-out}
    @keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
</head>
<body class="dark-theme">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: atob('QUl6YVN5QWUxLUpmTmRlME5LSU1kRTdwaGZFWGxtOUphcVVIMGpZ'),
      authDomain: atob('cHVsc2FyaS5maXJlYmFzZWFwcC5jb20='),
      databaseURL: atob('aHR0cHM6Ly9wdWxzYXJpLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=='),
      projectId: atob('cHVsc2FyaQ=='),
      storageBucket: atob('cHVsc2FyaS5maXJlYmFzZXN0b3JhZ2UuYXBw'),
      messagingSenderId: atob('ODI0MzA2MzIxMjMz'),
      appId: atob('MTo4MjQzMDYzMjEyMzM6d2ViOjJjOWJmYTAyMTcwYTE3ZDU2MGI1NzA=')
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_WALLETS = {
      ryachu: atob('MHgyMDgxNTdiNWVjMzk2NzU5ZTg3NTQwNTgxMDhlY2Y1M2UzMjM5MmZm').toLowerCase(),
      itsuki: atob('MHhmYWI1ODM1Y2ExNGZiM2Y5Zjk3OGM1ZTRkNzMzNzM0ZTYzOTRlMDNm').toLowerCase(),
      esteban: '0x875c5a7794b601f273da58e3c1d10671d16130ec'.toLowerCase()
    };

    const ADMIN_MAP = {
      [ADMIN_WALLETS.ryachu]: { name: 'Ryachu', role: 'ryachu' },
      [ADMIN_WALLETS.itsuki]: { name: 'Itsuki', role: 'itsuki' },
      [ADMIN_WALLETS.esteban]: { name: 'Esteban', role: 'esteban' }
    };

    const ADMIN_ROLES = ['ryachu', 'itsuki', 'esteban'];

    const PRIVATE_GATE = {
      tokenAddress: '0xef3dAa5fDa8Ad7aabFF4658f1F78061fd626B8f0',
      minRequired: 2000000
    };
    const ERC20_ABI = [
      'function balanceOf(address) view returns (uint256)',
      'function decimals() view returns (uint8)'
    ];

    const EMOJIS = {
      FACES:["😊","😂","😉","😍","😘","😛","😅","😢","😭","😠","😈","👽","🤖","🤡","💀","👻","💩"],
      HANDS:["👍","👎","👌","✌️","👏","👋","🙏","💪","☝️","🖖"],
      OBJECTS:["❤️","⭐","🔥","📚","💻","📱","📷","🔑","🔒","💡","💰","💎"],
      NATURE:["☀️","☁️","🌈","🌳","🌸","🌵","🐱","🐶","🦁","🦄","🐉","🐍"],
      FOOD:["🍕","🍔","🌮","🍣","🍰","🍦","☕","🍺","🍷","🍸"],
      ACTIVITIES:["⚽","🏀","🎾","🎵","🎸","🎮","♟️","🎨","🎬"]
    };

    const CHANNELS = [
      { id:"general", name:"GENERAL" },
      { id:"spanish", name:"ESPAÑOL" },
      { id:"dao", name:"DAO" }
    ];

    const safeKey = (value) => String(value || '').replace(/[.#$/\[\]]/g, '_');
    const makeIdentityKey = (raw) => {
      const value = String(raw || '').trim().toLowerCase();
      if (!value) return 'guest_unknown';
      if (value.startsWith('guest_')) return `guest_${safeKey(value.slice(6) || 'unknown')}`;
      return `wallet_${safeKey(value)}`;
    };

    const pinPathForChannel = (channelId) => `settings/pinned/${channelId}`;

    const normalizeWallet = (addr) => {
      if (!addr || typeof addr !== 'string') return '';
      let normalized = addr.trim().toLowerCase();
      if (!normalized.startsWith('0x')) normalized = '0x' + normalized;
      if (!/^0x[a-f0-9]{40}$/.test(normalized)) return '';
      return normalized;
    };

    const checkIsAdmin = (walletAddress) => {
      const normalized = normalizeWallet(walletAddress);
      if (!normalized) return { isAdmin: false, adminInfo: null, normalizedWallet: '' };
      const adminInfo = ADMIN_MAP[normalized];
      return {
        isAdmin: !!adminInfo,
        adminInfo: adminInfo || null,
        normalizedWallet: normalized
      };
    };

    function App(){
      const [me, setMe] = useState(null);
      const [messages, setMessages] = useState([]);
      const [onlineUsers, setOnlineUsers] = useState([]);
      const [mutedMap, setMutedMap] = useState({});
      const [pinnedMessage, setPinnedMessage] = useState(null);
      const [messageText, setMessageText] = useState("");
      const [darkMode, setDarkMode] = useState(true);
      const [showEmoji, setShowEmoji] = useState(false);
      const [emojiTab, setEmojiTab] = useState("FACES");
      const [activeChannel, setActiveChannel] = useState(CHANNELS[0]);
      const [mobileMenu, setMobileMenu] = useState(false);
      const [pinMode, setPinMode] = useState(false);
      const [banPanel, setBanPanel] = useState(false);
      const [mutePanel, setMutePanel] = useState(false);
      const [notice, setNotice] = useState({show:false,title:"",desc:"",tone:"red"});
      const bottomRef = useRef(null);

      const isAdmin = me?.isAdmin === true;
      const mutedUntilForMe = me?.identityKey ? mutedMap[me.identityKey] : null;
      const iAmMuted = !!(mutedUntilForMe && mutedUntilForMe > Date.now());

      const toggleTheme = () => {
        setDarkMode((prev) => {
          const next = !prev;
          document.body.className = next ? 'dark-theme' : 'light-theme';
          return next;
        });
      };

      const showNotice = (title, desc, tone='red') => setNotice({show:true,title,desc,tone});
      const closeNotice = () => setNotice({show:false,title:"",desc:"",tone:"red"});

      const roleClass = (role, fallback='text-gray-400') => {
        if (role === 'ryachu') return 'ryachu-name';
        if (role === 'itsuki') return 'itsuki-name';
        if (role === 'esteban') return 'esteban-name';
        if (role === 'admin') return 'text-red-400';
        return fallback;
      };

      const roleBadge = (role) => {
        if (role === 'ryachu') return '👑 ';
        if (role === 'itsuki') return '💎 ';
        if (role === 'esteban') return '🛡️ ';
        if (role === 'admin') return '⭐ ';
        return '';
      };

      useEffect(() => {
        const sessionWallet = sessionStorage.getItem('muzz_wallet_address');
        if (!sessionWallet) {
          window.location.href = 'login.html';
          return;
        }

        let statusRef = null;
        let statusListRef = null;
        let bannedRef = null;
        let mutedRef = null;
        let registryRef = null;

        firebase.auth().signInAnonymously().then(({ user }) => {
          const adminCheck = checkIsAdmin(sessionWallet);
          const isKnownAdmin = adminCheck.isAdmin;
          
          let username, role, isAdmin;
          
          if (isKnownAdmin && adminCheck.adminInfo) {
            username = adminCheck.adminInfo.name;
            role = adminCheck.adminInfo.role;
            isAdmin = true;
            console.log(`[ADMIN LOGIN] ${username} verified`);
          } else if (sessionWallet.startsWith('guest_')) {
            username = sessionWallet.replace('guest_', 'Guest_');
            role = 'guest';
            isAdmin = false;
          } else if (sessionWallet) {
            username = `User_${sessionWallet.slice(-6)}`;
            role = 'user';
            isAdmin = false;
          } else {
            username = 'Anonymous';
            role = 'anonymous';
            isAdmin = false;
          }

          const identityKey = makeIdentityKey(sessionWallet);
          
          const currentUser = {
            uid: user.uid,
            username,
            role,
            isWallet: !sessionWallet.startsWith('guest_') && !!sessionWallet,
            wallet: adminCheck.normalizedWallet || sessionWallet.toLowerCase(),
            identityKey,
            isAdmin,
            loginTime: Date.now()
          };
          
          setMe(currentUser);

          statusRef = db.ref(`status/${user.uid}`);
          statusRef.onDisconnect().remove();
          statusRef.set({
            uid: user.uid,
            username,
            role,
            wallet: currentUser.wallet || null,
            identityKey,
            isAdmin,
            lastSeen: Date.now(),
            adminVerified: isKnownAdmin
          });

          statusListRef = db.ref('status');
          statusListRef.on('value', (snap) => {
            setOnlineUsers(snap.val() ? Object.values(snap.val()) : []);
          });

          mutedRef = db.ref('muted');
          mutedRef.on('value', (snap) => setMutedMap(snap.val() || {}));

          bannedRef = db.ref(`banned/${identityKey}`);
          bannedRef.on('value', (snap) => {
            if (snap.val()) {
              alert('Your account has been banned from public chat.');
              sessionStorage.clear();
              window.location.href = 'login.html';
            }
          });

          if (currentUser.isWallet && currentUser.wallet) {
            registryRef = db.ref(`walletRegistry/${currentUser.wallet}`);
            registryRef.once('value').then((snap) => {
              const prev = snap.val() || {};
              registryRef.update({
                wallet: currentUser.wallet,
                username,
                role,
                isAdmin,
                isWallet: true,
                firstSeen: prev.firstSeen || firebase.database.ServerValue.TIMESTAMP,
                lastLogin: firebase.database.ServerValue.TIMESTAMP,
                lastSeen: firebase.database.ServerValue.TIMESTAMP,
                active: true
              });
            });
            registryRef.child('active').onDisconnect().set(false);
            registryRef.child('lastSeen').onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
          }
        }).catch((err) => {
          console.error('Anonymous sign-in failed:', err);
          window.location.href = 'login.html';
        });

        return () => {
          try { if (statusRef) statusRef.off(); } catch {}
          try { if (statusListRef) statusListRef.off(); } catch {}
          try { if (bannedRef) bannedRef.off(); } catch {}
          try { if (mutedRef) mutedRef.off(); } catch {}
          try { if (registryRef) registryRef.off(); } catch {}
        };
      }, []);

      useEffect(() => {
        if (!me) return;
        const pinRef = db.ref(pinPathForChannel(activeChannel.id));
        pinRef.on('value', (snap) => {
          const val = snap.val();
          if (val && typeof val === 'object' && val.content) {
            setPinnedMessage(val);
          } else if (val && typeof val === 'string') {
            setPinnedMessage({
              content: val,
              username: 'Admin',
              role: 'admin',
              timestamp: Date.now(),
              isLegacy: true
            });
          } else {
            setPinnedMessage(null);
          }
        });
        return () => pinRef.off();
      }, [me, activeChannel]);

      useEffect(() => {
        if (!me) return;
        const ref = db.ref(`messages/${activeChannel.id}`).limitToLast(50);
        ref.on('value', (snap) => {
          const data = snap.val();
          setMessages(data ? Object.keys(data).map((id) => ({ id, ...data[id] })) : []);
        });
        return () => ref.off();
      }, [me, activeChannel]);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior:'smooth' });
      }, [messages]);

      const goToPrivate = async () => {
        if (!me) return;

        if (me.isAdmin && ADMIN_ROLES.includes(me.role)) {
          console.log('[ADMIN] Private access granted');
          window.location.href = 'private.html';
          return;
        }

        if (!me.isWallet) {
          showNotice('WALLET REQUIRED', 'MUZZ PRIVATE requires wallet', 'yellow');
          return;
        }

        const walletAddress = sessionStorage.getItem('muzz_wallet_address')?.toLowerCase();
        if (!walletAddress || walletAddress.startsWith('guest_')) {
          showNotice('WALLET REQUIRED', 'Sign in with crypto wallet', 'yellow');
          return;
        }

        if (typeof window.ethereum === 'undefined' || typeof ethers === 'undefined') {
          showNotice('WEB3 REQUIRED', 'MetaMask needed', 'yellow');
          return;
        }

        try {
          showNotice('VERIFYING', 'Checking MUZZ balance...', 'blue');
          const provider = new ethers.providers.Web3Provider(window.ethereum);
          const token = new ethers.Contract(PRIVATE_GATE.tokenAddress, ERC20_ABI, provider);
          const [rawBalance, decimals] = await Promise.all([
            token.balanceOf(walletAddress),
            token.decimals()
          ]);

          const formattedBalance = parseFloat(ethers.utils.formatUnits(rawBalance, decimals));
          if (formattedBalance >= PRIVATE_GATE.minRequired) {
            window.location.href = 'private.html';
            return;
          }

          showNotice(
            'INSUFFICIENT BALANCE',
            `Need 2M MUZZ. You have ${formattedBalance.toLocaleString()} MUZZ.`,
            'red'
          );
        } catch (err) {
          console.error('Verification failed:', err);
          showNotice('ERROR', 'Could not verify balance', 'red');
        }
      };

      const sendMessage = async () => {
        if (!messageText.trim() || !me) return;
        if (iAmMuted) {
          alert('Estás silenciado temporalmente');
          return;
        }

        try {
          if (pinMode) {
            if (!isAdmin) {
              console.warn('[SECURITY] Unauthorized pin attempt');
              return;
            }
            
            const pinData = {
              content: messageText.trim(),
              username: me.username,
              role: me.role,
              timestamp: Date.now(),
              channel: activeChannel.id
            };
            
            await db.ref(pinPathForChannel(activeChannel.id)).set(pinData);
            
            setPinMode(false);
            setMessageText('');
            
            showNotice('MENSAJE FIJADO', 'El mensaje aparece en la parte superior', 'blue');
            
            console.log('[ADMIN] Message pinned:', pinData);
            return;
          }

          await db.ref(`messages/${activeChannel.id}`).push({
            content: messageText,
            username: me.username,
            role: me.role,
            userId: me.uid,
            identityKey: me.identityKey,
            wallet: me.wallet || null,
            timestamp: Date.now()
          });

          setMessageText('');
          setShowEmoji(false);
          
        } catch (err) {
          console.error('Send failed:', err);
          alert(`Error: ${err.message || 'No se pudo enviar'}`);
        }
      };

      const adminActions = {
        enablePinMode: () => {
          if (!isAdmin) {
            console.warn('[SECURITY] Blocked pin attempt');
            return;
          }
          setPinMode(true);
          setMessageText('');
          console.log('[ADMIN] Pin mode enabled');
        },
        
        clearChat: async () => {
          if (!isAdmin) {
            console.warn('[SECURITY] Blocked clear attempt');
            return;
          }
          if (!confirm(`¿${me.username}, borrar TODO #${activeChannel.name}?`)) return;
          try {
            await db.ref(`messages/${activeChannel.id}`).set(null);
            console.log('[ADMIN] Chat cleared');
          } catch (err) {
            alert('Error clearing chat');
          }
        },
        
        removePin: async () => {
          if (!isAdmin) {
            console.warn('[SECURITY] Blocked unpin attempt');
            return;
          }
          if (!confirm('¿Desfijar el mensaje actual?')) return;
          
          try {
            await db.ref(pinPathForChannel(activeChannel.id)).remove();
            setPinnedMessage(null);
            console.log('[ADMIN] Pin removed');
          } catch (err) {
            console.error('Remove pin failed:', err);
            alert('Error al desfijar');
          }
        },
        
        openBanPanel: () => {
          if (!isAdmin) {
            console.warn('[SECURITY] Blocked ban panel access');
            return;
          }
          setBanPanel(true);
        },
        
        openMutePanel: () => {
          if (!isAdmin) {
            console.warn('[SECURITY] Blocked mute panel access');
            return;
          }
          setMutePanel(true);
        },
        
        banUser: async (target) => {
          if (!isAdmin) {
            alert('Unauthorized');
            return;
          }
          if (!target?.identityKey) {
            alert('Invalid user');
            return;
          }
          if (target.isAdmin || ADMIN_ROLES.includes(target.role)) {
            alert('Cannot ban admin');
            return;
          }
          
          if (!confirm(`Ban ${target.username} permanently?`)) {
            setBanPanel(false);
            return;
          }
          
          try {
            await db.ref(`banned/${target.identityKey}`).set({
              username: target.username,
              role: target.role || 'user',
              uid: target.uid || null,
              wallet: target.wallet || null,
              bannedAt: Date.now(),
              bannedBy: me.username,
              bannedByWallet: me.wallet
            });
            if (target.uid) await db.ref(`status/${target.uid}`).remove();
            alert(`${target.username} banned.`);
          } catch (err) {
            alert('Ban failed');
          }
          setBanPanel(false);
        },
        
        muteUser: async (target) => {
          if (!isAdmin) {
            alert('Unauthorized');
            return;
          }
          if (!target?.identityKey) {
            alert('Invalid user');
            return;
          }
          if (target.isAdmin || ADMIN_ROLES.includes(target.role)) {
            alert('Cannot mute admin');
            return;
          }
          
          try {
            await db.ref(`muted/${target.identityKey}`).set(Date.now() + 60000);
            alert(`${target.username} muted 1min.`);
          } catch (err) {
            alert('Mute failed');
          }
          setMutePanel(false);
        }
      };

      if (!me) {
        return <div className="h-full flex items-center justify-center text-red-600 font-orbitron animate-pulse">CONNECTING...</div>;
      }

      return (
        <div className="flex h-screen p-2 md:p-4 lg:p-6 gap-4 md:gap-6 max-w-[1600px] mx-auto overflow-hidden">
          
          <aside className={`fixed lg:relative z-50 inset-y-0 left-0 w-80 lg:w-64 transition-all duration-300 transform panel-3d p-4 md:p-6 flex flex-col ${mobileMenu ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none overflow-hidden`}>
            
            <div className="mb-4 md:mb-6 flex items-center gap-3 shrink-0">
              <div className="w-8 h-8 md:w-10 md:h-10 bg-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-red-600/30">
                <i className="fas fa-ghost text-white text-xs md:text-sm"></i>
              </div>
              <h1 className="font-orbitron font-black text-lg md:text-xl italic tracking-tighter">MUZZ<span className="text-red-600">SNAP</span></h1>
              <button onClick={() => setMobileMenu(false)} className="lg:hidden ml-auto text-gray-500 hover:text-white w-8 h-8 flex items-center justify-center">
                <i className="fas fa-times"></i>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto custom-scroll space-y-4 md:space-y-6 pr-1 md:pr-2">
              
              {isAdmin && (
                <div className="bg-red-900/20 border border-red-600/40 rounded-xl p-3 md:p-4">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2">
                      <i className="fas fa-shield-alt text-red-500 animate-pulse"></i>
                      <p className="text-[10px] text-red-500 font-bold tracking-[0.2em] uppercase">Admin Terminal</p>
                    </div>
                    <span className="text-[8px] text-red-400 font-mono">{me?.role?.toUpperCase()}</span>
                  </div>
                  
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={adminActions.enablePinMode} className="bg-red-600/20 hover:bg-red-600/40 border border-red-600/50 text-red-400 text-[9px] md:text-[10px] font-bold py-2.5 md:py-3 px-2 rounded-lg transition-all active:scale-95 touch-manipulation flex items-center justify-center gap-1">
                      <i className="fas fa-thumbtack"></i>FIJAR
                    </button>
                    <button onClick={adminActions.clearChat} className="bg-red-600/20 hover:bg-red-600/40 border border-red-600/50 text-red-400 text-[9px] md:text-[10px] font-bold py-2.5 md:py-3 px-2 rounded-lg transition-all active:scale-95 touch-manipulation flex items-center justify-center gap-1">
                      <i className="fas fa-trash"></i>LIMPIAR
                    </button>
                    <button onClick={adminActions.openBanPanel} className="bg-red-600/20 hover:bg-red-600/40 border border-red-600/50 text-red-400 text-[9px] md:text-[10px] font-bold py-2.5 md:py-3 px-2 rounded-lg transition-all active:scale-95 touch-manipulation flex items-center justify-center gap-1">
                      <i className="fas fa-user-slash"></i>BANEAR
                    </button>
                    <button onClick={adminActions.openMutePanel} className="bg-red-600/20 hover:bg-red-600/40 border border-red-600/50 text-red-400 text-[9px] md:text-[10px] font-bold py-2.5 md:py-3 px-2 rounded-lg transition-all active:scale-95 touch-manipulation flex items-center justify-center gap-1">
                      <i className="fas fa-volume-mute"></i>MUTEAR
                    </button>
                  </div>

                  <div className="mt-3 pt-2 border-t border-red-600/20 text-[8px] text-red-400/60 font-mono">
                    <div className="flex justify-between">
                      <span>WALLET:</span>
                      <span>{me?.wallet?.slice(0, 6)}...{me?.wallet?.slice(-4)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>VERIFIED:</span>
                      <span className="text-green-400">✓ ADMIN</span>
                    </div>
                  </div>
                </div>
              )}

              {!isAdmin && me?.isWallet && (
                <div className="bg-gray-800/30 border border-gray-700 rounded-xl p-3">
                  <p className="text-[10px] text-gray-500 font-bold tracking-wider uppercase mb-2">Tu Nodo</p>
                  <div className="text-xs text-gray-400 font-mono truncate">
                    {me?.wallet?.slice(0, 8)}...{me?.wallet?.slice(-6)}
                  </div>
                </div>
              )}

              <div>
                <p className="text-[9px] md:text-[10px] text-gray-500 font-bold tracking-[0.2em] mb-2 md:mb-4 uppercase">Channels</p>
                {CHANNELS.map((channel) => (
                  <button
                    key={channel.id}
                    onClick={() => { setActiveChannel(channel); setMobileMenu(false); }}
                    className={`w-full text-left px-3 md:px-4 py-2.5 md:py-3 rounded-xl text-xs font-bold mb-1 transition-all ${activeChannel.id === channel.id ? 'bg-red-600/10 text-red-600 border-l-2 border-red-600 shadow-lg shadow-red-600/5' : 'text-gray-500 hover:text-white hover:bg-white/5'}`}
                  >
                    # {channel.name}
                  </button>
                ))}
              </div>

              <div>
                <p className="text-[9px] md:text-[10px] text-gray-500 font-bold tracking-[0.2em] mb-2 md:mb-4 uppercase">Muzz</p>
                <button onClick={goToPrivate} className="w-full text-left px-3 md:px-4 py-2.5 md:py-3 rounded-xl text-xs font-bold mb-1 transition-all text-gray-500 hover:text-white hover:bg-red-600/5 border border-white/5 flex items-center">
                  <i className={`fas ${me?.isWallet ? 'fa-user-secret' : 'fa-lock'} mr-2`}></i>
                  PRIVATE
                </button>
                <p className="text-[8px] md:text-[9px] text-gray-600 px-1 uppercase tracking-wider mt-1">
                  {isAdmin ? 'Admin bypass active' : 'Wallet + 2M MUZZ required'}
                </p>
              </div>

              <div>
                <p className="text-[9px] md:text-[10px] text-gray-500 font-bold tracking-[0.2em] mb-2 md:mb-4 uppercase">Online — {onlineUsers.length}</p>
                <div className="space-y-2 md:space-y-3">
                  {onlineUsers.map((user, idx) => (
                    <div key={`${user.uid || user.identityKey || idx}`} className="flex items-center gap-2 md:gap-3 px-2">
                      <span className={`w-2 h-2 rounded-full ${user.isAdmin ? 'bg-red-500 shadow-[0_0_8px_rgba(255,0,0,0.5)]' : 'bg-green-500 shadow-[0_0_8px_rgba(57,255,20,0.5)]'}`}></span>
                      <span className={`text-[10px] md:text-[11px] truncate font-bold uppercase flex-1 ${roleClass(user.role,'text-gray-400')}`}>
                        {roleBadge(user.role)}{user.username}
                      </span>
                      {user.isAdmin && <span className="text-[8px] text-red-500">[A]</span>}
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <button onClick={() => { sessionStorage.clear(); window.location.href = 'login.html'; }} className="mt-4 md:mt-6 w-full py-2.5 md:py-3 text-[9px] md:text-[10px] border border-red-900/30 text-red-600 rounded-xl uppercase font-black tracking-widest hover:bg-red-600/5 transition-all shrink-0">
              <i className="fas fa-power-off mr-2"></i>Disconnect
            </button>
          </aside>

          <main className="flex-1 panel-3d flex flex-col overflow-hidden border border-white/5 h-full relative">
            
            {/* MENSAJE FIJADO - Estilo Telegram */}
            {pinnedMessage && (
              <div className="pinned-message bg-red-900/20 border-b border-red-600/40 flex-shrink-0">
                <div className="px-4 py-3 flex items-start gap-3">
                  <div className="shrink-0 mt-1">
                    <i className="fas fa-thumbtack text-red-500 text-sm transform -rotate-45"></i>
                  </div>
                  
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1">
                      <span className={`text-xs font-bold uppercase ${roleClass(pinnedMessage.role, 'text-red-400')}`}>
                        {roleBadge(pinnedMessage.role)}{pinnedMessage.username || 'Admin'}
                      </span>
                      <span className="text-[10px] text-gray-500">
                        {pinnedMessage.timestamp ? new Date(pinnedMessage.timestamp).toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'}) : ''}
                      </span>
                    </div>
                    
                    <p className="text-sm text-white/90 leading-relaxed break-words line-clamp-2">
                      {pinnedMessage.content}
                    </p>
                  </div>
                  
                  {isAdmin && (
                    <button 
                      onClick={adminActions.removePin}
                      className="shrink-0 w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-600/20 text-red-400 hover:text-red-300 transition"
                    >
                      <i className="fas fa-times text-xs"></i>
                    </button>
                  )}
                </div>
                <div className="h-0.5 bg-gradient-to-r from-red-600/50 via-red-500/30 to-transparent"></div>
              </div>
            )}

            <header className="h-14 md:h-16 flex items-center justify-between px-4 md:px-8 bg-white/5 border-b border-white/5 flex-shrink-0">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setMobileMenu(true)} 
                  className="lg:hidden w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition"
                >
                  <i className={`fas ${isAdmin ? 'fa-shield-alt text-red-500' : 'fa-bars text-gray-400'}`}></i>
                </button>
                <div>
                  <h2 className="text-xs md:text-sm font-black tracking-[0.15em] text-red-600 uppercase italic">/ {activeChannel.name}</h2>
                  {isAdmin && (
                    <div className="flex items-center gap-1 text-[8px] text-red-500 font-bold uppercase tracking-wider">
                      <i className="fas fa-crown"></i>
                      {me?.role?.toUpperCase()} ACCESS
                    </div>
                  )}
                </div>
              </div>
              <button onClick={toggleTheme} className="w-9 h-9 md:w-10 md:h-10 rounded-xl border border-red-600/20 flex items-center justify-center hover:bg-red-600/5 transition-all">
                {darkMode ? <i className="fas fa-sun text-yellow-500"></i> : <i className="fas fa-moon text-blue-500"></i>}
              </button>
            </header>

            <div className="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-4 md:gap-5 custom-scroll">
              {messages.map((msg, index) => {
                const muted = !!(msg.identityKey && mutedMap[msg.identityKey] && mutedMap[msg.identityKey] > Date.now());
                const date = new Date(msg.timestamp);
                const prev = index > 0 ? messages[index - 1] : null;
                const prevDate = prev ? new Date(prev.timestamp) : null;
                const showDay = !prevDate || date.toDateString() !== prevDate.toDateString();

                const formatDay = (d) => {
                  const now = new Date();
                  const yesterday = new Date(now);
                  yesterday.setDate(yesterday.getDate() - 1);
                  if (d.toDateString() === now.toDateString()) return 'HOY';
                  if (d.toDateString() === yesterday.toDateString()) return 'AYER';
                  return d.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).toUpperCase();
                };

                return (
                  <React.Fragment key={msg.id}>
                    {showDay && (
                      <div className="flex items-center gap-4 my-4">
                        <div className="flex-1 h-px bg-gradient-to-r from-transparent via-red-600/30 to-transparent"></div>
                        <span className="text-[9px] font-black tracking-[0.3em] text-red-600/70 px-4 py-1.5 bg-red-600/5 rounded-full border border-red-600/20">{formatDay(date)}</span>
                        <div className="flex-1 h-px bg-gradient-to-r from-red-600/30 via-transparent to-transparent"></div>
                      </div>
                    )}

                    <div className={`flex flex-col ${msg.userId === me.uid ? 'items-end' : 'items-start'}`}>
                      <span className={`text-[10px] font-black mb-1.5 uppercase px-2 ${roleClass(msg.role,'text-gray-500')}`}>
                        {roleBadge(msg.role)}{msg.username} {muted && '🔇'}
                      </span>
                      <div className={`bubble-3d shadow-xl ${msg.userId === me.uid ? 'me' : 'other'} ${muted ? 'muted' : ''}`}>
                        {msg.content}
                      </div>
                    </div>
                  </React.Fragment>
                );
              })}
              <div ref={bottomRef}></div>
            </div>

            <div className={`p-3 md:p-6 ${darkMode ? 'bg-black/40' : 'bg-gray-50'} border-t border-white/5 flex-shrink-0`}>
              
              {notice.show && (
                <div className={`mb-3 px-4 py-3 rounded-xl border text-xs ${notice.tone === 'blue' ? 'bg-cyan-500/10 border-cyan-500/30 text-cyan-300' : notice.tone === 'yellow' ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-300' : 'bg-red-600/10 border-red-600/30 text-red-300'}`}>
                  <div className="flex items-start gap-3">
                    <i className={`fas ${notice.tone === 'blue' ? 'fa-shield-alt' : notice.tone === 'yellow' ? 'fa-lock' : 'fa-ban'} mt-0.5`}></i>
                    <div className="flex-1">
                      <p className="font-black uppercase tracking-wider mb-1">{notice.title}</p>
                      <p className="leading-relaxed">{notice.desc}</p>
                    </div>
                    <button onClick={closeNotice} className="opacity-70 hover:opacity-100"><i className="fas fa-times"></i></button>
                  </div>
                </div>
              )}

              {pinMode && (
                <div className="mb-3 px-4 py-3 bg-yellow-500/20 border border-yellow-500/50 rounded-xl text-yellow-400">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <i className="fas fa-thumbtack text-lg animate-bounce"></i>
                      <div>
                        <p className="text-xs font-bold uppercase tracking-wider">Modo Fijar Activado</p>
                        <p className="text-[10px] text-yellow-300/80">Escribe y toca 📌 para fijar</p>
                      </div>
                    </div>
                    <button 
                      onClick={() => {setPinMode(false); setMessageText('');}} 
                      className="text-yellow-400 hover:text-white w-8 h-8 flex items-center justify-center rounded-lg hover:bg-yellow-500/20 transition"
                    >
                      <i className="fas fa-times"></i>
                    </button>
                  </div>
                </div>
              )}

              {banPanel && (
                <div className="fixed inset-x-2 bottom-20 md:absolute md:inset-auto md:mb-3 z-50 panel-3d border border-red-600/30 p-3 md:p-4 max-h-48 overflow-y-auto custom-scroll shadow-2xl rounded-xl">
                  <div className="flex justify-between items-center mb-3 sticky top-0 bg-inherit pb-2 border-b border-red-600/20">
                    <p className="text-xs font-bold text-red-500 uppercase flex items-center gap-2">
                      <i className="fas fa-user-slash"></i>Banear Usuario
                    </p>
                    <button onClick={() => setBanPanel(false)} className="text-gray-500 hover:text-red-500 w-8 h-8 flex items-center justify-center">
                      <i className="fas fa-times"></i>
                    </button>
                  </div>
                  {onlineUsers.filter((u) => !u.isAdmin).length === 0 ? (
                    <p className="text-xs text-gray-500 text-center py-4">No hay usuarios para banear</p>
                  ) : (
                    onlineUsers.filter((u) => !u.isAdmin).map((user) => (
                      <button 
                        key={user.uid} 
                        onClick={() => adminActions.banUser(user)} 
                        className="w-full text-left px-3 py-3 text-xs hover:bg-red-600/10 rounded-lg mb-1 flex items-center gap-3 active:scale-95 transition-transform touch-manipulation"
                      >
                        <i className="fas fa-user-slash text-red-500"></i>
                        <span className="font-bold flex-1">{user.username}</span>
                        <span className="text-[8px] text-gray-500">{user.role}</span>
                      </button>
                    ))
                  )}
                </div>
              )}

              {mutePanel && (
                <div className="fixed inset-x-2 bottom-20 md:absolute md:inset-auto md:mb-3 z-50 panel-3d border border-yellow-600/30 p-3 md:p-4 max-h-48 overflow-y-auto custom-scroll shadow-2xl rounded-xl">
                  <div className="flex justify-between items-center mb-3 sticky top-0 bg-inherit pb-2 border-b border-yellow-600/20">
                    <p className="text-xs font-bold text-yellow-500 uppercase flex items-center gap-2">
                      <i className="fas fa-volume-mute"></i>Mutear (1min)
                    </p>
                    <button onClick={() => setMutePanel(false)} className="text-gray-500 hover:text-yellow-500 w-8 h-8 flex items-center justify-center">
                      <i className="fas fa-times"></i>
                    </button>
                  </div>
                  {onlineUsers.filter((u) => !u.isAdmin).length === 0 ? (
                    <p className="text-xs text-gray-500 text-center py-4">No hay usuarios para mutear</p>
                  ) : (
                    onlineUsers.filter((u) => !u.isAdmin).map((user) => (
                      <button 
                        key={user.uid} 
                        onClick={() => adminActions.muteUser(user)} 
                        className="w-full text-left px-3 py-3 text-xs hover:bg-yellow-600/10 rounded-lg mb-1 flex items-center gap-3 active:scale-95 transition-transform touch-manipulation"
                      >
                        <i className="fas fa-volume-mute text-yellow-500"></i>
                        <span className="font-bold flex-1">{user.username}</span>
                        <span className="text-[8px] text-gray-500">{user.role}</span>
                      </button>
                    ))
                  )}
                </div>
              )}

              {showEmoji && (
                <div className="mb-4 panel-3d border border-red-600/20 overflow-hidden shadow-2xl h-auto flex-shrink-0">
                  <div className="flex bg-black/10 border-b border-white/5 overflow-x-auto custom-scroll">
                    {Object.keys(EMOJIS).map((tab) => (
                      <button key={tab} onClick={() => setEmojiTab(tab)} className={`px-4 py-2 text-[9px] font-black uppercase tracking-tighter ${emojiTab === tab ? 'text-red-600 bg-red-600/5' : 'text-gray-500'}`}>
                        {tab}
                      </button>
                    ))}
                  </div>
                  <div className="emoji-window custom-scroll">
                    {EMOJIS[emojiTab].map((emoji) => (
                      <span key={emoji} onClick={() => setMessageText((prev) => prev + emoji)} className="emoji-btn">{emoji}</span>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex items-center bg-black/30 border border-white/10 rounded-2xl p-2.5 pl-4 focus-within:border-red-600/50 transition-all shadow-inner">
                <button onClick={() => setShowEmoji((prev) => !prev)} className="text-gray-500 hover:text-red-600 transition-colors mr-3">
                  <i className="far fa-laugh-beam text-xl"></i>
                </button>

                <input
                  value={messageText}
                  onChange={(e) => setMessageText(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && sendMessage()}
                  placeholder={iAmMuted ? 'Estás silenciado...' : pinMode ? 'Mensaje a fijar...' : 'Transmit message...'}
                  disabled={iAmMuted}
                  className="flex-1 bg-transparent border-none focus:ring-0 text-sm hacker-input outline-none"
                />

                <button 
                  onClick={sendMessage} 
                  disabled={iAmMuted || !messageText.trim()}
                  className={`w-11 h-11 md:w-12 md:h-12 ml-2 ${
                    pinMode ? 'bg-yellow-600 hover:bg-yellow-500' : 'bg-red-600 hover:bg-red-500'
                  } ${
                    (iAmMuted || !messageText.trim()) ? 'opacity-50 cursor-not-allowed' : ''
                  } rounded-xl flex items-center justify-center active:scale-95 transition-all shadow-lg shrink-0 touch-manipulation`}
                >
                  <i className={`fas ${
                    pinMode ? 'fa-thumbtack' : 'fa-paper-plane'
                  } text-white ${pinMode && messageText.trim() ? 'animate-bounce' : ''}`}></i>
                </button>
              </div>
            </div>
          </main>

          {mobileMenu && <div onClick={() => setMobileMenu(false)} className="fixed inset-0 bg-black/90 z-40 lg:hidden backdrop-blur-md"></div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
