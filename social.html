<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MuzzSnap Social</title>
  <meta name="theme-color" content="#111418" />

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root{
      --bg:#20262d;--panel:#12171d;--soft:#1a2028;--soft-2:#232b35;
      --line:rgba(255,255,255,.08);--text:#eef2f7;--muted:#93a0b3;
      --red:#ff2b2b;--red-soft:rgba(255,43,43,.14);--green:#4ade80;--blue:#60a5fa;
      --shadow:0 18px 50px rgba(0,0,0,.35);--radius:22px;
      --safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:radial-gradient(circle at top right,rgba(255,43,43,.10),transparent 24%),
      radial-gradient(circle at bottom left,rgba(96,165,250,.07),transparent 20%),var(--bg);
      color:var(--text);overflow:hidden;font-size:14px;
    }
    button,input,textarea{font:inherit} a{text-decoration:none;color:inherit}
    .app{display:grid;grid-template-columns:280px minmax(0,720px) 340px;gap:18px;height:100vh;max-width:1450px;margin:0 auto;padding:18px}
    .card{background:rgba(18,23,29,.92);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    .sidebar,.rightbar,.feed-shell{min-height:0;display:flex;flex-direction:column}.sidebar,.rightbar{padding:18px}
    .brand{display:flex;align-items:center;gap:12px;padding:6px 4px 18px;margin-bottom:8px}
    .brand-badge{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#ff3b3b,#9d1111);box-shadow:0 0 24px rgba(255,43,43,.25);font-size:20px}
    .brand h1{margin:0;font-size:24px;letter-spacing:-.04em;font-weight:900;font-style:italic}.brand span{color:var(--red)}
    .nav{display:flex;flex-direction:column;gap:8px;margin:6px 0 16px}
    .nav-btn{border:none;background:transparent;color:var(--text);display:flex;align-items:center;gap:14px;padding:12px 13px;border-radius:18px;cursor:pointer;transition:.2s ease;text-align:left;width:100%}
    .nav-btn:hover,.nav-btn.active{background:var(--red-soft);color:#fff}
    .nav-icon{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05);font-size:15px;flex-shrink:0}
    .compose-main{margin:10px 0 18px;padding:14px 18px;border:none;border-radius:18px;font-weight:800;color:#fff;background:linear-gradient(145deg,#ff3d3d,#b10f0f);cursor:pointer;box-shadow:0 12px 30px rgba(255,43,43,.22)}
    .profile-mini{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--soft);border:1px solid var(--line)}
    .avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#3a4552,#19202a);border:1px solid rgba(255,255,255,.08);font-weight:800;flex-shrink:0}
    .profile-mini .name{font-weight:800}.profile-mini .sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
    .feed-shell{overflow:hidden}.feed-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);background:rgba(18,23,29,.84);backdrop-filter:blur(14px);border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
    .feed-top h2{margin:0;font-size:18px;letter-spacing:-.03em}.ghost-btn{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:10px 14px;border-radius:14px;cursor:pointer}
    .feed-scroll{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0}
    .composer{padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01))}
    .composer-head{display:flex;gap:14px;align-items:flex-start}.composer textarea{width:100%;min-height:88px;resize:none;border:none;outline:none;background:transparent;color:var(--text);font-size:15px;line-height:1.4}
    .composer-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
    .tools-left{display:flex;gap:8px;flex-wrap:wrap}.tool-pill{padding:9px 12px;border-radius:999px;background:rgba(96,165,250,.12);color:#bfdbfe;font-size:12px;border:1px solid rgba(96,165,250,.18)}
    .post-btn{border:none;padding:12px 18px;border-radius:14px;color:#fff;font-weight:800;background:linear-gradient(145deg,#ff3d3d,#b10f0f);cursor:pointer}.count{color:var(--muted);font-size:12px}
    .post{border:1px solid var(--line);border-radius:24px;padding:18px;background:rgba(255,255,255,.02);margin-bottom:14px}
    .post-head{display:flex;gap:12px;align-items:flex-start}.post-meta{min-width:0;flex:1}.post-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
    .post-name{font-weight:900}.post-handle,.post-time{color:var(--muted);font-size:13px}.verified{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#07111d;font-size:11px;font-weight:900}
    .post-text{margin:12px 0 14px 60px;color:#edf2f7;line-height:1.6;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
    .post-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-left:60px}
    .action-btn{border:none;background:transparent;color:var(--muted);padding:10px 12px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s ease}
    .action-btn:hover{background:rgba(255,255,255,.04);color:#fff}.action-btn.liked{color:#ff7b95;background:rgba(255,123,149,.12)}.action-btn.reposted{color:var(--green);background:rgba(74,222,128,.12)}.action-btn.shared{color:#bfdbfe;background:rgba(96,165,250,.12)}
    .comments{margin:14px 0 0 60px;border-top:1px solid var(--line);padding-top:12px;display:none}.comments.open{display:block}.comment{padding:10px 0;border-top:1px solid rgba(255,255,255,.05)}.comment:first-child{border-top:none}.comment strong{font-size:13px}.comment p{margin:4px 0 0;color:#dbeafe;font-size:13px;line-height:1.45}
    .comment-box{display:flex;gap:8px;margin-top:10px}.comment-box input{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);border-radius:14px;padding:10px 12px;outline:none}.comment-box button{border:none;border-radius:14px;background:linear-gradient(145deg,#ff3d3d,#b10f0f);color:white;font-weight:800;padding:10px 14px;cursor:pointer}
    .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.24em;color:var(--muted);margin:0 0 14px;font-weight:800}
    .search{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--soft);border:1px solid var(--line);margin-bottom:16px}.search input{width:100%;border:none;outline:none;background:transparent;color:var(--text)}
    .widget{padding:16px;border-radius:20px;background:var(--soft);border:1px solid var(--line);margin-bottom:16px}.trend,.follow-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}.trend:first-of-type,.follow-row:first-of-type{border-top:none;padding-top:0}.trend small,.follow-row small{display:block;color:var(--muted);margin-top:4px}.follow-btn{border:none;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:#fff;color:#111}
    .mobile-bottom{display:none;position:fixed;left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:rgba(18,23,29,.92);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:10px;grid-template-columns:repeat(5,1fr);gap:6px}.mobile-bottom button{border:none;background:transparent;color:var(--muted);padding:10px 6px;border-radius:14px;cursor:pointer;font-size:11px}.mobile-bottom button.active{background:var(--red-soft);color:#fff}
    .fab{display:none;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:22px;border:none;color:#fff;font-size:22px;background:linear-gradient(145deg,#ff3d3d,#b10f0f);box-shadow:0 14px 34px rgba(255,43,43,.28);z-index:31;cursor:pointer}
    @media(max-width:1180px){.app{grid-template-columns:250px minmax(0,1fr) 300px}}
    @media(max-width:980px){body{overflow:auto}.app{height:auto;min-height:100dvh;grid-template-columns:1fr;padding:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}.sidebar,.rightbar{display:none}.feed-shell{min-height:0}.mobile-bottom,.fab{display:grid}.fab{display:block}.post-text,.post-actions,.comments{margin-left:0}.feed-top{position:sticky}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar card">
      <div class="brand"><div class="brand-badge">👻</div><h1>MUZZ<span>SOCIAL</span></h1></div>
      <nav class="nav">
        <<button class="nav-btn active" onclick="location.href='index.html'"><span class="nav-icon">🏠</span><span>Home</span></button>
      <button class="nav-btn" onclick="location.href='white.html'"><span class="nav-icon">📄</span><span>Whitepaper</span></button>
      <button class="nav-btn" onclick="showMuzzLogin()"><span class="nav-icon">⚡</span><span>MuzzSnap</span></button>
      <button class="nav-btn" onclick="requireWalletPage('chat.html')"><span class="nav-icon">💬</span><span>Chat</span></button>
      <button class="nav-btn" onclick="requireWalletPage('social.html')"><span class="nav-icon">🌐</span><span>Social</span></button>
      <button class="nav-btn" onclick="requireWalletPage('private.html')"><span class="nav-icon">🔒</span><span>Private</span></button>
      <button class="nav-btn" onclick="requireWalletPage('game.html')"><span class="nav-icon">🎮</span><span>Game</span></button>
      <button class="nav-btn" onclick="location.href='muzzstudio.html'"><span class="nav-icon">🎬</span><span>MuzzStudio</span></button>
      <button class="nav-btn" onclick="location.href='swap.html'"><span class="nav-icon">🛒</span><span>Buy Muzz</span></button>
      <button class="nav-btn" onclick="window.open('https://t.me/MuzzSnap','_blank')"><span class="nav-icon">✈️</span><span>Telegram</span></button>
      <button class="nav-btn" onclick="window.open('https://x.com/MuzzleToken','_blank')"><span class="nav-icon">𝕏</span><span>X.com</span></button>
      <button class="nav-btn" onclick="location.href='mailto:muzzsnapofficial@gmail.com'"><span class="nav-icon">✉️</span><span>Contact</span></button>
      </nav>
      <button class="compose-main" id="openComposer">Post something</button>
      <div class="profile-mini"><div class="avatar" id="meAvatar">MZ</div><div style="min-width:0;flex:1"><div class="name" id="meName">Muzz User</div><div class="sub" id="meHandle">@muzzuser</div></div></div>
    </aside>

    <main class="feed-shell card">
      <div class="feed-top"><h2>Social</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ghost-btn" onclick="goToChat(event)">Chat</button><button class="ghost-btn" id="refreshBtn">Refresh</button></div></div>
      <div class="feed-scroll" id="feedScroll">
        <section class="composer" id="composerCard">
          <div class="composer-head"><div class="avatar" id="composerAvatar">MZ</div><div style="flex:1;min-width:0"><textarea id="postInput" maxlength="280" placeholder="What’s happening in MUZZ world?"></textarea><div class="composer-tools"><div class="tools-left"><span class="tool-pill">Crypto</span><span class="tool-pill">Community</span><span class="tool-pill">Project update</span></div><div style="display:flex;align-items:center;gap:12px"><span class="count" id="charCount">0 / 280</span><button class="post-btn" id="publishBtn">Post</button></div></div></div></div>
        </section>
        <div id="feed"></div>
      </div>
    </main>

    <aside class="rightbar card">
      <div class="search"><span>🔎</span><input type="text" placeholder="Search Muzz Social" id="searchInput"></div>
      <section class="widget"><p class="section-title">Live counters</p><div class="trend"><div><strong id="postTotal">0 posts</strong><small>Firebase synced</small></div><span style="color:var(--muted)">LIVE</span></div><div class="trend"><div><strong id="actionTotal">0 actions</strong><small>Likes · RT · Share</small></div><span style="color:var(--muted)">REAL</span></div></section>
      <section class="widget"><p class="section-title">Official Links</p><div class="trend"><div><strong>X.com</strong><small>@MuzzleToken</small></div><button class="follow-btn" onclick="window.open('https://x.com/MuzzleToken','_blank')">Open</button></div><div class="trend"><div><strong>Telegram</strong><small>MuzzSnap community</small></div><button class="follow-btn" onclick="window.open('https://t.me/MuzzSnap','_blank')">Open</button></div></section>
    </aside>
  </div>

  <div class="mobile-bottom"><button onclick="location.href='index.html'">Home</button><button class="active">Social</button><button onclick="goToChat(event)">Chat</button><button onclick="location.href='private.html'">Private</button><button onclick="location.href='game.html'">Game</button></div>
  <button class="fab" id="fabBtn">＋</button>

  <script>
    const firebaseConfig = {
      apiKey: atob('QUl6YVN5QWUxLUpmTmRlME5LSU1kRTdwaGZFWGxtOUphcVVIMGpZ'),
      authDomain: atob('cHVsc2FyaS5maXJlYmFzZWFwcC5jb20='),
      databaseURL: atob('aHR0cHM6Ly9wdWxzYXJpLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=='),
      projectId: atob('cHVsc2FyaQ=='),
      storageBucket: atob('cHVsc2FyaS5maXJlYmFzZXN0b3JhZ2UuYXBw'),
      messagingSenderId: atob('ODI0MzA2MzIxMjMz'),
      appId: atob('MTo4MjQzMDYzMjEyMzM6d2ViOjJjOWJmYTAyMTcwYTE3ZDU2MGI1NzA=')
    };
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const wallet = sessionStorage.getItem('muzz_wallet_address');
    const loginMethod = sessionStorage.getItem('muzz_login_method');
    if(!wallet || !loginMethod){ location.href='index.html'; }

    const safeKey = v => String(v||'').replace(/[.#$/\[\]]/g,'_').toLowerCase();
    const userKey = safeKey(wallet);
    const savedName = sessionStorage.getItem('muzz_username');
    const isGuest = wallet.startsWith('guest_');
    const meName = savedName || (isGuest ? wallet.replace('guest_','') : 'Node_' + wallet.slice(-4));
    const meHandle = '@' + meName.toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,18);

    document.getElementById('meName').textContent = meName;
    document.getElementById('meHandle').textContent = meHandle;
    document.getElementById('meAvatar').textContent = meName.slice(0,2).toUpperCase();
    document.getElementById('composerAvatar').textContent = meName.slice(0,2).toUpperCase();

    let posts = {};
    let commentsByPost = {};
    let actionsByPost = {};
    let searchTerm = '';

    function goToChat(e){ if(e) e.preventDefault(); location.href='chat.html'; }
    function goComposer(){ document.getElementById('composerCard').scrollIntoView({behavior:'smooth',block:'start'}); document.getElementById('postInput').focus(); }

    function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
    function shortTime(ts){ if(!ts) return 'now'; const diff=Date.now()-ts; if(diff<60000)return'now'; if(diff<3600000)return Math.floor(diff/60000)+'m'; if(diff<86400000)return Math.floor(diff/3600000)+'h'; return Math.floor(diff/86400000)+'d'; }
    function count(obj){ return obj ? Object.keys(obj).length : 0; }
    function isMineAction(postId,type){ return !!(actionsByPost[postId] && actionsByPost[postId][type] && actionsByPost[postId][type][userKey]); }

    function renderPosts(){
      let arr = Object.entries(posts || {}).map(([id,p])=>({id,...p})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      if(searchTerm) arr = arr.filter(p => (p.text||'').toLowerCase().includes(searchTerm) || (p.username||'').toLowerCase().includes(searchTerm));
      document.getElementById('postTotal').textContent = arr.length + ' posts';

      let totalActions = 0;
      Object.values(actionsByPost || {}).forEach(a => totalActions += count(a.likes)+count(a.reposts)+count(a.shares));
      document.getElementById('actionTotal').textContent = totalActions + ' actions';

      document.getElementById('feed').innerHTML = arr.map(post=>{
        const a = actionsByPost[post.id] || {};
        const comments = commentsByPost[post.id] || {};
        const likes = count(a.likes);
        const reposts = count(a.reposts);
        const shares = count(a.shares);
        const commentCount = count(comments);
        const liked = isMineAction(post.id,'likes');
        const reposted = isMineAction(post.id,'reposts');
        const shared = isMineAction(post.id,'shares');
        const commentsHtml = Object.entries(comments).sort((x,y)=>(x[1].createdAt||0)-(y[1].createdAt||0)).map(([cid,c])=>`
          <div class="comment"><strong>${escapeHtml(c.username)}</strong><p>${escapeHtml(c.text)}</p></div>
        `).join('');

        return `
          <article class="post" id="post-${post.id}">
            <div class="post-head">
              <div class="avatar">${escapeHtml((post.username||'MU').slice(0,2).toUpperCase())}</div>
              <div class="post-meta"><div class="post-name-row"><span class="post-name">${escapeHtml(post.username)}</span><span class="verified">✓</span><span class="post-handle">${escapeHtml(post.handle || '')}</span><span class="post-time">· ${shortTime(post.createdAt)}</span></div></div>
            </div>
            <div class="post-text">${escapeHtml(post.text)}</div>
            <div class="post-actions">
              <button class="action-btn" onclick="toggleComments('${post.id}')">💬 <span>${commentCount}</span></button>
              <button class="action-btn ${reposted?'reposted':''}" onclick="toggleAction('${post.id}','reposts')">🔁 <span>${reposts}</span></button>
              <button class="action-btn ${liked?'liked':''}" onclick="toggleAction('${post.id}','likes')">❤ <span>${likes}</span></button>
              <button class="action-btn ${shared?'shared':''}" onclick="sharePost('${post.id}')">↗ <span>${shares}</span></button>
            </div>
            <div class="comments" id="comments-${post.id}">
              ${commentsHtml || '<div class="comment"><p>No comments yet.</p></div>'}
              <div class="comment-box"><input id="comment-input-${post.id}" placeholder="Write a comment..."><button onclick="addComment('${post.id}')">Reply</button></div>
            </div>
          </article>
        `;
      }).join('');
    }

    function publishPost(){
      const input = document.getElementById('postInput');
      const text = input.value.trim();
      if(!text) return;
      const ref = db.ref('social/posts').push();
      ref.set({
        username: meName,
        handle: meHandle,
        wallet,
        userKey,
        text,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
      input.value = '';
      updateCount();
      document.getElementById('feedScroll').scrollTo({top:0,behavior:'smooth'});
    }

    async function toggleAction(postId,type){
      const ref = db.ref(`social/actions/${postId}/${type}/${userKey}`);
      const snap = await ref.once('value');
      if(snap.exists()) ref.remove();
      else ref.set({ wallet, username: meName, at: firebase.database.ServerValue.TIMESTAMP });
    }

    async function sharePost(postId){
      await db.ref(`social/actions/${postId}/shares/${userKey}`).set({ wallet, username: meName, at: firebase.database.ServerValue.TIMESTAMP });
      const post = posts[postId];
      const text = post ? `${post.username}: ${post.text}\n\nMuzzSnap Social` : 'MuzzSnap Social';
      if(navigator.share){ navigator.share({title:'MuzzSnap Social', text}).catch(()=>{}); }
      else{ navigator.clipboard.writeText(text).then(()=>alert('Post copied to clipboard.')).catch(()=>alert(text)); }
    }

    function toggleComments(postId){
      const el = document.getElementById(`comments-${postId}`);
      if(el) el.classList.toggle('open');
    }

    function addComment(postId){
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if(!text) return;
      db.ref(`social/comments/${postId}`).push({
        username: meName,
        handle: meHandle,
        wallet,
        userKey,
        text,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
      input.value = '';
    }

    function updateCount(){ document.getElementById('charCount').textContent = `${document.getElementById('postInput').value.length} / 280`; }

    window.toggleAction = toggleAction;
    window.sharePost = sharePost;
    window.toggleComments = toggleComments;
    window.addComment = addComment;
    window.goToChat = goToChat;

    firebase.auth().signInAnonymously().then(()=>{
      db.ref(`social/users/${userKey}`).update({
        wallet, username: meName, handle: meHandle,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
      });
      db.ref('social/posts').limitToLast(100).on('value', snap => { posts = snap.val() || {}; renderPosts(); });
      db.ref('social/actions').on('value', snap => { actionsByPost = snap.val() || {}; renderPosts(); });
      db.ref('social/comments').on('value', snap => { commentsByPost = snap.val() || {}; renderPosts(); });
    }).catch(err => {
      alert('Firebase auth failed. Check Firebase Auth Anonymous provider.');
      console.error(err);
    });

    document.getElementById('publishBtn').addEventListener('click', publishPost);
    document.getElementById('postInput').addEventListener('input', updateCount);
    document.getElementById('postInput').addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey)&&e.key==='Enter') publishPost(); });
    document.getElementById('openComposer').addEventListener('click', goComposer);
    document.getElementById('fabBtn').addEventListener('click', goComposer);
    document.getElementById('refreshBtn').addEventListener('click', renderPosts);
